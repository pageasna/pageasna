<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="26" height="26" fill="#e7ddc4"/>
      <rect width="13" height="26" fill="#ded2b3"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1.1" fill="#3a3226" opacity="0.18"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.22  0 0 0 0 0.19  0 0 0 0 0.15  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="url(#stripes)"/>
  <rect width="1000" height="420" fill="url(#dots)"/>

  <!-- outer ornate frame -->
  <rect x="14" y="14" width="972" height="392" fill="none" stroke="#3a3226" stroke-width="3"/>
  <rect x="22" y="22" width="956" height="376" fill="none" stroke="#3a3226" stroke-width="1"/>

  <!-- corner flourishes -->
  <g stroke="#3a3226" stroke-width="1.6" fill="none">
    <path d="M22 60 C 40 30, 70 22, 100 22"/>
    <path d="M978 60 C 960 30, 930 22, 900 22"/>
    <path d="M22 360 C 40 390, 70 398, 100 398"/>
    <path d="M978 360 C 960 390, 930 398, 900 398"/>
  </g>
  <g fill="#3a3226">
    <circle cx="100" cy="22" r="3"/>
    <circle cx="900" cy="22" r="3"/>
    <circle cx="100" cy="398" r="3"/>
    <circle cx="900" cy="398" r="3"/>
  </g>

  <!-- scalloped divider top -->
  <g fill="none" stroke="#3a3226" stroke-width="1.4" opacity="0.7">
    <path d="M60 90 Q 90 70 120 90 T 180 90 T 240 90 T 300 90 T 360 90 T 420 90 T 480 90 T 540 90 T 600 90 T 660 90 T 720 90 T 780 90 T 840 90 T 900 90 T 940 90"/>
  </g>

  <!-- handle -->
  <text x="500" y="145" text-anchor="middle"
        font-family="'Cinzel Decorative','Times New Roman',serif"
        font-size="46" fill="#211c15" stroke="#3a3226" stroke-width="0.6"
        letter-spacing="2">@pageasna</text>

  <!-- central emblem -->
  <g transform="translate(500,240)">
    <circle r="86" fill="#ede4d3" stroke="#3a3226" stroke-width="2.5"/>
    <circle r="74" fill="none" stroke="#3a3226" stroke-width="1"/>
    <text text-anchor="middle" dy="-6" font-family="'Playfair Display', serif"
          font-size="15" letter-spacing="3" fill="#3a3226">GAME DEV</text>
    <text text-anchor="middle" dy="16" font-family="'Playfair Display', serif"
          font-size="13" letter-spacing="2" fill="#3a3226">✦ CS UNDERGRAD ✦</text>
    <text text-anchor="middle" dy="38" font-family="'Playfair Display', serif"
          font-size="13" letter-spacing="3" fill="#3a3226">AUTHOR</text>
    <g stroke="#3a3226" stroke-width="1" opacity="0.6">
      <path d="M-86 0 A86 86 0 0 1 -60 -62" fill="none"/>
      <path d="M86 0 A86 86 0 0 0 60 -62" fill="none"/>
      <path d="M-86 0 A86 86 0 0 0 -60 62" fill="none"/>
      <path d="M86 0 A86 86 0 0 1 60 62" fill="none"/>
    </g>
  </g>

  <!-- name block -->
  <g transform="translate(500,352)">
    <rect x="-150" y="-26" width="300" height="46" fill="#211c15"/>
    <text text-anchor="middle" dy="6" font-family="'UnifrakturCook','Times New Roman',serif"
          font-size="30" fill="#ede4d3" letter-spacing="1">asna</text>
  </g>
  <text x="500" y="392" text-anchor="middle" font-family="'Playfair Display', serif"
        font-style="italic" font-size="14" fill="#3a3226">…still compiling. don't judge the warnings.</text>

  <rect width="1000" height="420" filter="url(#grain)" opacity="0.5"/>
</svg>
